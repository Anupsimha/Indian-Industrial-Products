services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    ports:
      - "3001:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - backend

    networks:
      - iip-network

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/iip
      - CORS_ORIGINS=*

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - iip-network

    restart: unless-stopped

  postgres:
    image: postgres:15-alpine

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=iip

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - iip-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iip"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

networks:
  iip-network:
    driver: bridge

volumes:
  postgres_data: