services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "127.0.0.1:3001:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    env_file:
      - ./frontend/.env

    depends_on:
      - backend

    networks:
      - iip-network

    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
      - ./reels-uploaded:/app/reels-uploaded
      - ./products-images:/app/products-images
      - ./enquiry-media:/app/enquiry-media

    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/iip
      - CORS_ORIGINS=*

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - iip-network

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: unless-stopped

  postgres:
    image: postgres:15-alpine

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=iip

    volumes:
      - ./postgres_data:/var/lib/postgresql/data

    networks:
      - iip-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iip"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

networks:
  iip-network:
    driver: bridge
